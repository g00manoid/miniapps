<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тетрис</title>
  <style>
    :root {
      --cell: 30px;
      --bg: #0f1220;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #6ee7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 0%, #1e2a4a 0%, var(--bg) 60%);
      color: #e8ecf5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: #7c3aed;
      top: -120px; left: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: #06b6d4;
      bottom: -120px; right: -80px;
    }

    .game {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 22px;
      align-items: flex-start;
    }

    .board-wrap {
      position: relative;
      padding: 12px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    #board {
      display: grid;
      gap: 2px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px;
      border-radius: 10px;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.03);
      transition: background 0.05s, opacity 0.05s;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 180px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .panel h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .stat {
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(110, 231, 255, 0.5);
    }

    .mini {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      justify-content: center;
    }
    .mini .cell {
      width: 18px;
      height: 18px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: #0f1220;
      background: linear-gradient(135deg, #8be9fd, #6200ea);
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.2s;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.96); }

    .hint {
      font-size: 11px;
      color: #7c86a5;
      line-height: 1.7;
    }
    .hint b { color: #c4ccde; }

    .overlay {
      position: absolute;
      inset: 12px;
      border-radius: 10px;
      background: rgba(10, 12, 25, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      z-index: 5;
      text-align: center;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: 34px;
      background: linear-gradient(135deg, #6ee7ff, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .overlay p { color: #aeb6cf; font-size: 15px; }

    .touch {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .touch button {
      background: var(--panel);
      color: #e8ecf5;
      border: 1px solid var(--border);
      font-size: 20px;
      padding: 16px;
    }

    @media (max-width: 640px) {
      :root { --cell: 26px; }
      .game { flex-direction: column; align-items: center; }
      .sidebar { flex-direction: row; flex-wrap: wrap; width: 100%; justify-content: center; }
      .sidebar .panel { flex: 1; min-width: 120px; }
      .touch { display: grid; width: 100%; max-width: 320px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="board-wrap">
      <div id="board"></div>
      <div class="overlay" id="overlay">
        <h1 id="overlay-title">ТЕТРИС</h1>
        <p id="overlay-text">Классическая головоломка</p>
        <button id="start-btn">Играть</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="panel">
        <h2>Счёт</h2>
        <div class="stat" id="score">0</div>
      </div>
      <div class="panel">
        <h2>Уровень</h2>
        <div class="stat" id="level">1</div>
      </div>
      <div class="panel">
        <h2>Линии</h2>
        <div class="stat" id="lines">0</div>
      </div>
      <div class="panel">
        <h2>Далее</h2>
        <div class="mini" id="next"></div>
      </div>
      <div class="panel">
        <h2>Управление</h2>
        <div class="controls">
          <button id="pause-btn">Пауза</button>
          <div class="hint">
            <b>← →</b> — движение<br>
            <b>↑</b> — поворот<br>
            <b>↓</b> — ускорить<br>
            <b>Space</b> — сброс<br>
            <b>P</b> — пауза
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="touch">
    <button data-act="left">◀</button>
    <button data-act="rotate">⟳</button>
    <button data-act="down">▼</button>
    <button data-act="drop">⤓</button>
  </div>

  <script>
    const COLS = 10, ROWS = 20;
    const board = document.getElementById('board');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');

    const COLORS = {
      I: '#06b6d4', O: '#f4c542', T: '#a78bfa',
      S: '#34d399', Z: '#f87171', J: '#60a5fa', L: '#fb923c'
    };

    const SHAPES = {
      I: [[1,1,1,1]],
      O: [[1,1],[1,1]],
      T: [[0,1,0],[1,1,1]],
      S: [[0,1,1],[1,1,0]],
      Z: [[1,1,0],[0,1,1]],
      J: [[1,0,0],[1,1,1]],
      L: [[0,0,1],[1,1,1]]
    };

    let grid = [];
    let current, next, score, level, lines;
    let dropInterval, dropCounter, lastTime, running, paused;
    let rafId;

    // Кэш ячеек поля (вычисляется один раз)
    const cellNodes = () => document.querySelectorAll('#board .cell');

    function getCell(r, c) {
      const node = cellNodes()[r * COLS + c];
      return node || null;
    }

    function createBoard() {
      board.innerHTML = '';
      board.style.gridTemplateColumns = `repeat(${COLS}, var(--cell))`;
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          board.appendChild(cell);
          row.push(null);
        }
        grid.push(row);
      }
    }

    function bag() {
      const keys = Object.keys(SHAPES);
      for (let i = keys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [keys[i], keys[j]] = [keys[j], keys[i]];
      }
      return keys;
    }
    let queue = [];
    function nextPiece() {
      if (queue.length === 0) queue = bag();
      const key = queue.pop();
      const shape = SHAPES[key];
      return {
        key,
        shape: shape.map(r => [...r]),
        x: Math.floor((COLS - shape[0].length) / 2),
        y: 0
      };
    }

    function collide(piece, g) {
      const m = piece.shape;
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (!m[r][c]) continue;
          const nx = piece.x + c;
          const ny = piece.y + r;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && g[ny][nx]) return true;
        }
      }
      return false;
    }

    function merge(piece) {
      piece.shape.forEach((row, r) => {
        row.forEach((v, c) => {
          if (v) {
            const y = piece.y + r;
            const x = piece.x + c;
            if (y >= 0) grid[y][x] = piece.key;
          }
        });
      });
    }

    function rotate(matrix) {
      const rows = matrix.length, cols = matrix[0].length;
      const res = [];
      for (let c = 0; c < cols; c++) {
        const newRow = [];
        for (let r = rows - 1; r >= 0; r--) newRow.push(matrix[r][c]);
        res.push(newRow);
      }
      return res;
    }

    function tryRotate() {
      const rotated = rotate(current.shape);
      const prev = current.shape;
      const tests = [{x:0},{x:1},{x:-1},{x:2},{x:-2}];
      for (const t of tests) {
        current.shape = rotated;
        current.x += t.x;
        if (!collide(current, grid)) return;
        current.x -= t.x;
      }
      current.shape = prev;
    }

    function clearLines() {
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(cell => cell)) {
          grid.splice(r, 1);
          const empty = [];
          for (let c = 0; c < COLS; c++) empty.push(null);
          grid.unshift(empty);
          cleared++;
          r++;
        }
      }
      if (cleared) {
        const points = [0, 100, 300, 500, 800][cleared] * level;
        score += points;
        lines += cleared;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(80, 1000 - (level - 1) * 90);
        updateStats();
      }
    }

    function spawn() {
      current = next;
      next = nextPiece();
      drawNext();
      if (collide(current, grid)) gameOver();
    }

    // Рисует одну фигуру с проверкой ВСех границ
    function shade(piece, opacity) {
      piece.shape.forEach((row, r) => {
        row.forEach((v, c) => {
          if (!v) return;
          const y = piece.y + r;
          const x = piece.x + c;
          if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;
          const node = getCell(y, x);
          if (!node) return;
          node.style.background = COLORS[piece.key];
          node.style.opacity = opacity;
          node.style.boxShadow = opacity === '1'
            ? `0 0 16px ${COLORS[piece.key]}`
            : 'none';
        });
      });
    }

    function draw() {
      // 1. Фон сетки
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const el = grid[r][c];
          const node = getCell(r, c);
          if (!node) continue;
          node.style.background = el ? COLORS[el] : 'rgba(255,255,255,0.03)';
          node.style.boxShadow  = el ? `0 0 12px ${COLORS[el]}` : 'none';
          node.style.opacity = '1';
        }
      }

      // 2. Призрачная фигура
      const ghost = { shape: current.shape, x: current.x, y: current.y };
      while (!collide(ghost, grid)) ghost.y++;
      shade(ghost, '0.25');

      // 3. Текущая фигура
      shade(current, '1');
    }

    function drawNext() {
      const mini = document.getElementById('next');
      mini.innerHTML = '';
      const shape = next.shape;
      for (let r = 0; r < shape.length; r++) {
        for (let c = 0; c < shape[r].length; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          if (shape[r][c]) {
            cell.style.background = COLORS[next.key];
            cell.style.boxShadow = `0 0 10px ${COLORS[next.key]}`;
          }
          mini.appendChild(cell);
        }
      }
    }

    function updateStats() {
      document.getElementById('score').textContent = score;
      document.getElementById('level').textContent = level;
      document.getElementById('lines').textContent = lines;
    }

    function drop() {
      current.y++;
      if (collide(current, grid)) {
        current.y--;
        merge(current);
        clearLines();
        spawn();
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(current, grid)) {
        current.y++;
        score += 2;
      }
      current.y--;
      merge(current);
      clearLines();
      spawn();
      updateStats();
      draw();
    }

    function move(dir) {
      current.x += dir;
      if (collide(current, grid)) current.x -= dir;
      draw();
    }

    function update(time = 0) {
      if (!running || paused) return;
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;
      if (dropCounter > dropInterval) drop();
      draw();
      rafId = requestAnimationFrame(update);
    }

    function startGame() {
      createBoard();
      score = 0; level = 1; lines = 0;
      dropInterval = 1000; dropCounter = 0; lastTime = 0;
      paused = false; running = true;
      queue = [];
      current = nextPiece();
      next = nextPiece();
      updateStats();
      drawNext();
      overlay.classList.add('hidden');
      cancelAnimationFrame(rafId);
      update();
    }

    function gameOver() {
      running = false;
      cancelAnimationFrame(rafId);
      overlayTitle.textContent = 'Игра окончена';
      overlayText.textContent = `Ваш счёт: ${score}`;
      startBtn.textContent = 'Ещё раз';
      overlay.classList.remove('hidden');
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = 'Пауза';
        overlayText.textContent = 'Нажмите P для продолжения';
        startBtn.textContent = 'Продолжить';
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        lastTime = performance.now();
        update();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (!running) return;
      switch (e.key) {
        case 'ArrowLeft': move(-1); break;
        case 'ArrowRight': move(1); break;
        case 'ArrowDown': drop(); score += 1; updateStats(); break;
        case 'ArrowUp': tryRotate(); draw(); break;
        case ' ': e.preventDefault(); hardDrop(); break;
        case 'p': case 'P': togglePause(); break;
      }
    });

    startBtn.addEventListener('click', () => {
      if (paused) togglePause();
      else startGame();
    });
    pauseBtn.addEventListener('click', togglePause);

    document.querySelectorAll('.touch button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!running || paused) return;
        const act = btn.dataset.act;
        if (act === 'left') move(-1);
        else if (act === 'right') move(1);
        else if (act === 'rotate') { tryRotate(); draw(); }
        else if (act === 'down') drop();
        else if (act === 'drop') hardDrop();
      });
    });

    createBoard();
  </script>
</body>
</html>
